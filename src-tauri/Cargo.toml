[package]
name = "listener"
version = "0.6.1"
description = "A quiet home for your music"
authors = ["Listener"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.90"

[lib]
name = "listener_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-ios = ["dep:amll-lyric", "tokio/rt-multi-thread"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies"] }
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
amll-lyric = { version = "0.3.0", optional = true, default-features = false, features = ["eqrc", "lrc", "qrc", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
